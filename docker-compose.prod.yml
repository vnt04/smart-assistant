services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
    restart: unless-stopped
    env_file: ${COMPOSE_ENV_FILE:-.env.production}
    environment:
      NODE_ENV: production
      REDIS_HOST: redis
      REDIS_PORT: 6379
      UPLOAD_DIR: /data/uploads
    # MYSQL_HOST/MYSQL_PORT lấy từ .env.production (trỏ tới MySQL native trên host).
    # extra_hosts cho phép dùng "host.docker.internal" nếu .env đặt MYSQL_HOST=host.docker.internal;
    # nếu .env đặt thẳng public IP thì block này không bắt buộc nhưng để cho linh hoạt.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "127.0.0.1:${BACKEND_HOST_PORT:-3001}:3000"
    volumes:
      - uploads_data:/data/uploads
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s

  frontend:
    build:
      context: .
      dockerfile: apps/frontend/Dockerfile
      args:
        VITE_API_BASE_URL: /api
        VITE_APP_NAME: ${VITE_APP_NAME:-Personal Assistant}
    restart: unless-stopped
    ports:
      - "127.0.0.1:${FRONTEND_HOST_PORT:-8081}:80"
    depends_on:
      backend:
        condition: service_healthy

  backup:
    image: mysql:8.0
    profiles: ["backup"]
    env_file: ${COMPOSE_ENV_FILE:-.env.production}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./backups:/backups
      - ./docker/scripts:/scripts:ro
      - uploads_data:/uploads:ro
    entrypoint: ["/bin/sh", "/scripts/backup.sh"]

volumes:
  redis_data:
    name: assistant_prod_redis_data
  uploads_data:
    name: assistant_prod_uploads_data
